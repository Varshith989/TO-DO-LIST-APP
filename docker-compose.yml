version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: taskmaster-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: taskmaster
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmaster-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/taskmaster
      JWT_SECRET: super_secret_jwt_key_taskmaster_prod_2026_xyz
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    depends_on:
      - mongodb

volumes:
  mongo_data:
