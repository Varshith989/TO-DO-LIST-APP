name: Build TaskMaster Pro Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Android Release APK
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskmaster-pro-android-release
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "TaskMaster Pro Android App"
          body: "Direct standalone APK download for TaskMaster Pro Android Client."
          draft: false
          prerelease: false
          files: mobile/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
